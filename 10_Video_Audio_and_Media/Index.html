<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Video and Audio</title>
</head>
<body>
    <H1 id="Videoo">Video</H1>
    <video src="Video.mp4" controls width="500" muted loop poster="Thumbnail.png" ></video> <!-- controls is used to add controls in video like play pause etc .Autoplay is used to play video as it loaded-->
    <h1 id="audioo">Audio</h1>
    <audio src="Music.mp3" controls autoplay loop muted preload="" ></audio>
    <H1 id="SVG" >Inline Svg</H1>
    <!--svg is used to create logos-->
    <svg height="100" width="100">
    <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>
    <H1 id="Videoo">File Svg</H1>
    <img src="SVG.svg" alt="SVG">
    <h1 id="audioo">Iframe</h1>
    <!--iframe is used to embed or add another website to our website-->

    <iframe src="https://github.com/SyntaxCourseHub/SIgma-Web-Development" frameborder="10" height="500" width="500"></iframe>
    <!--you can also add youtube video in website-->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=oHN3azKu2DIyzjp9&amp;start=795" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>

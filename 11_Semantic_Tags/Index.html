<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag</title>
</head>
<body>
    <!--What are Semantic Tags-->
    <!--Semantic tags are HTML tags that clearly describe the meaning and purpose of the content they contain.Eg header,footer,nav,artical,figure etc.It is also good for SEO-->
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Semantic</h1>
    </main>

    <footer>
        Copyright 2026
    </footer>
</body>
</html>

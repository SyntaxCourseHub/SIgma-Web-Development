<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
</head>
<body>
    <header>
        <h1>Media Player</h1>
    </header>
    <main>
        <div>
            <h1>Song Video</h1>
            <h2>Bluemoon</h2>
            <video src="Bluemoon.mp4" controls height="360" width="640"></video>
            <br>
            <h2>Retro</h2>
            <video src="Retro.mp4" controls height="360" width="640" ></video>
            <br>
            <h2>Zoom</h2>
            <video src="Zoom.mp4" controls height="360" width="640"></video>
        </div>

                     
        <div>
            <h1>Songs Audio</h1>
            <audio src="Bluemoon.mp3" controls></audio>
            <br>
            <audio src="Retro.mp3" controls></audio>
            <br>
            <audio src="zoom.mp3" controls></audio>
        </div>
              
    </main>
    
</body>
</html>

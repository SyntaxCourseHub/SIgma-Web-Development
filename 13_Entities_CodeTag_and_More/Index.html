<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entities, CodeTag and More</title>
</head>
<body>
    <!-- What is the use of entities -->
     <!-- Entites are special characters used to display reserved words -->
      <h1>Entities Usage</h1>
      This is the code for h1 -> &lt;h1&gt;Content &lt;/h1&gt;
      <br>
      &copy;Copyright 

      <h1>pre tag Usage</h1>
      <!-- pre tag is used to to show the content as it is with space to anything no changes -->
      <pre>
        <h2>helllo</h2>



        <h2>h e l l o</h2>
      </pre>
    &copy;&nbsp;&nbsp;&nbsp;&nbsp;hello
    <!--nbsp is non breaking spaces it is used to add spaces to content because html takes only 1 space and ignore other-->

    <h2>Quotation Usage</h2>
    <!-- block quote is used to write longer quotation -->
    <blockquote cite="source-url">
        Write quotation here
    </blockquote>

    <q cite="source-url">
        Write quotation here
    </q>
    <h2>Usage of Code Tag</h2>
    <!-- It is used to write a peice of code in website -->
    <code>
        print("hello")
    </code>


    <footer>
        <h1>IT IS THE END OF HTML.NOW WE START THE CSS ie STYLING.STAY SIGMA</h1>
    </footer>
</body>
</html>

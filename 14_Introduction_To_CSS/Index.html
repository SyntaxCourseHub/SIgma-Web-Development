<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* div is selector and color is declaration.color is also key and the cyan is value it is only applicable to div tag*/
        div{ 
            color: cyan;
            background-color: yellow;
        }
        /* we can use comma to add multiple selector */
        span,p{
            color: red
        }
    </style>
    <title>CSS STARTING</title>
</head>
<body>
    <div>
        HELLO FROM CSS
    </div>
    <br>
    <div>
        hello from SIGMA
    </div>
    <span>
        <h5>Paragraph</h5>
    </span>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Alias cum, ea illo enim, repellat, quisquam porro doloremque quibusdam architecto sequi at placeat rerum.</p>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <style>
        * {
            margin:0;
            padding:0;
            border:0;
        }

        .box {
            background-color: cyan;
        }

        .box1 {
            color: yellow;
            padding: 20px;
            margin: 25px ;
            border: 2px solid red;
            height: 200px;
            box-sizing: border-box; /* This means that we have written the height is sum of height of border and padding*/
            

        }
        /* Now See the margin of box1 and box2 it should be 50 in between these boxes but there is margin colapse.It Means that when the vertical margins of two block elements touch, they combine into one margin instead of adding together.Refer Margin Colapse.png*/

        .box2 {
            color: red;
            padding: 20px;
            margin: 25px ;
            border: 2px solid black;
            height: 200px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="box box1">
        IM A BOX
    </div>

    <div class="box box2">
        IM ALSO A BOX
    </div>
    <!-- Refer to BoxModel.png to see how the box model works -->

</body>

</html>

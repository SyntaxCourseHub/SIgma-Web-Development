<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=32px.0">
    <title>Flexbox Masterclass</title>
    <style>
        .cont{
            /* align-content: center; Used when we have multiple lines after wrap */
            border: 2px solid red;
            display: flex;
            height: 80vh;
            width: 80vw;
            
             /* flex-wrap: wrap; it is used when the content is overflowing */
            /* justify-content: center; Used to center the item from horizontal */
            /* align-items: center; ;used to center the item from vertical */
            /* flex-direction: column; It is used to change the flex direction    */
            /* flex-flow: column wrap; It is used to set the flow and wrap it */
            /* gap: 30px; Used to set the gap in between items in horizontal and vertical(if wrapped) */
            /* row-gap: 40px;
            column-gap: 10px;*/
        } 

        .item{
            flex-grow: 2; /*Each item take the space of two items*/
            height: 32px;
            width: 32px;
            flex-shrink: 2;
            border: 2px solid black;
            /* margin: 5px; */
            background-color: aquamarine;
        }
        .order-1{
            order: 1; /*Used to set the order of element which comes first.less number comes first*/
        }
        .order-2{
            order: 2;
        }
        .order-3{
            order: 3;
        }
        .order-4{
            order: 4;
        }
        .item1{
            align-self: flex-end; /*used to configure specific one item*/
        }

    </style>
</head>
<body>
    <div class="cont">
        <div class=" item1 item order-4">1</div>

<!-- properties of justify-content in css-> -->
<!-- 
1. flex-start->	        Items move to the start
2. flex-end->	        Items move to the end
3. center->	            Items go to the center
4. space-between->	    Equal space between items; no space at edges
5. space-around->	    Equal space around each item
6. space-evenly->	    Exactly equal space between and around items
7. start->	            Aligns items at the logical start
8. end->	            Aligns items at the logical end -->

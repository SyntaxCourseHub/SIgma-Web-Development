<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Masterclass</title>
    <style>
        .container{
            border: 2px solid black;
            display: grid; 
            justify-items: center;
            grid-template-areas: "nav nav nav"
                                 "sidbar article article"
                                 "foot foot foot"
                                 "anfoot anfoot anfoot";

        gap: 2px;
            

        }
        .item{
            border: 2px solid red;
           
            height: 55px;
            width: 55px;
        }
       .item1{
        grid-area: nav;
        background-color: aqua;
       }
       .item2{
        grid-area: sidbar;
        background-color: greenyellow;
       }
       .item3{
        grid-area: article;
        background-color: chocolate;
       }
       .item4{
        grid-area: foot;
        background-color: pink;
       }
       .item5{
        grid-area: anfoot;
        background-color: gold
       }
       
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">nav</div>
        <div class="item item2">Sidebar</div>
        <div class="item item3">Article1</div>
        <div class="item item4">Footer</div>
        <div class="item item5 ">Another Footer</div>
    </div>
    
</body>
</html>

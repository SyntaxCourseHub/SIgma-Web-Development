<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
</head>
<body>
    <h1>My Bookmarks</h1>
    <h2>Primary Bookmarks</h2>
    <p>
        <a target="_blank" href="https://www.google.com">Open Google</a> </p> <!--<a>___</a> is called Anchor tag.It is used to add hyperlink in website-->
    <p><a target="_blank" href="https://www.amazon.com">Open Amazon</a></p><!--We use target="_blank" to open the link in new tab-->
    <p><a target="_blank" href="https://www.github.com">Open GitHub</a></p>
    
    <h2>Secondary Bookmarks</h2>
    <p><a target="_blank" href="https://www.chatgpt.com">Open ChatGPT</a></p>
    <p><a target="_blank" href="https://gemini.google.com/">Open Gemini</a></p>
    <p><a target="_blank" href="https://www.gmail.com">Open Gmail</a></p>
</body>
</html>

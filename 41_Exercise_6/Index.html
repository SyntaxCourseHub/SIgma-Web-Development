
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercise 6</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
        }

        ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .navigation {
            margin: 3px 50px 0;
            padding: 10px 20px;
            border: 1px solid rgb(172, 172, 172);
            display: flex;
            align-items: center;
            background-color: rgb(246, 246, 246);
        }

        .navigation img {
            width: 120px;
        }

        .holder {
            margin-left: auto;
        }

        main {
            margin: 30px 50px;
        }
    </style>
</head>

<body>

    <header>
        <nav class="navigation">

            <img
                src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg"
                alt="UltraEdit Logo"
            >

            <div class="holder">
                <ul>
                    <li>Products</li>
                    <li>Pricing</li>
                    <li>Resources</li>
                    <li>About Us</li>
                </ul>
            </div>

        </nav>
    </header>

    <main>
        <div>

</body>
</html>

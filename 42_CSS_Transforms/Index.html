<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
    <style>
        body{
             display: flex;
            align-items: center;
            justify-content: center;

        }
        .box{
            height: 50px;
            width: 50px;
            border: 2px solid black;
            background-color: bisque;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(50deg); /*Used to Rotate*/
            /* transform: rotateX(50deg); Used to Rotate the box in X similar in Y and Z */
            /* transform: scale(2);
            transform:skew(5deg) ;
            transform: translateY(60px);
             */
             transform-origin:5% 0% ; /*Used to set the point of origin*/
        }
        .container{
            /* display: flex;
            align-items: center;
            justify-content: center; */
            height: 80vh;
            width: 80vw;
            border: 2px solid red;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
    
</body>
</html>

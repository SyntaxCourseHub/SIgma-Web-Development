<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container {
            width: 600px;
            height: 300px;
            border: 3px solid black;
            position: relative;
            overflow: hidden;
        }

        .ball {
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            position: absolute;

            animation: bounce 3s infinite;
        }

        @keyframes bounce {
            0% {
                left: 0;
                bottom: 0;
            }

            20% {
                left: 100px;
                bottom: 200px;
            }

            40% {
                left: 200px;
                bottom: 0;
            }

            55% {
                left: 300px;
                bottom: 130px;
            }

            70% {
                left: 400px;
                bottom: 0;
            }

            82% {
                left: 475px;
                bottom: 70px;
            }

            90% {
                left: 500px;
                bottom: 0;
            }

            100% {
                left: 550px;
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="ball"></div>
    </div>

</body>
</html>

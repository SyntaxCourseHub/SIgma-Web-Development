<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quiz</title>
</head>
<body>
    <form action="" method="post">
        <div>
            <label for="Name">Enter Your Name</label>
            <input type="text" name="Name" id="Name" placeholder="Eg James Bond" required>
        </div>
        <div>
            <label for="City">Enter Your City</label>
            <input type="text" name="City" id="City" placeholder="Eg Amritsarr" required>
        </div>
        <div>
            <label for="Pin">Enter Your Pincode</label>
            <input type="text" name="PinCode" id="Pin" placeholder="Eg 14234">
        </div>


    </form>
</body>
</html>
